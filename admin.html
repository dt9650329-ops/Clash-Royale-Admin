*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--texto);font:16px/1.5 "Nunito",system-ui,sans-serif;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  background:radial-gradient(ellipse 80% 50% at 50% 0,rgba(41,221,251,.14),transparent 70%),var(--fondo)}
main{max-width:960px;margin:0 auto;padding:20px 0 56px}
h1,h2,.num-grande{font-family:"Lilita One","Nunito",system-ui,sans-serif;font-weight:400;letter-spacing:.01em}
h1{font-size:1.9rem;line-height:1.15;margin:0 0 6px;text-shadow:0 2px 16px rgba(41,221,251,.22)}
h2{font-size:1.25rem;margin:0 0 10px}
.suave{color:var(--suave);margin:0 0 18px}
.oculto{display:none!important}
.centro{max-width:480px;margin:8vh auto 0;text-align:center}
.logo-hero{width:min(60vw,230px);aspect-ratio:1;margin:0 auto 6px;background:var(--logo) center/contain no-repeat;
  -webkit-mask-image:radial-gradient(closest-side,#000 90%,transparent 100%);mask-image:radial-gradient(closest-side,#000 90%,transparent 100%)}
.logo-mini{flex:none;width:44px;height:44px;border-radius:12px;border:2px solid var(--linea);background:var(--logo) center/cover no-repeat;box-shadow:0 0 14px rgba(41,221,251,.25)}
button{font:inherit;color:inherit}
.btn{padding:12px 18px;border-radius:10px;font-weight:700;cursor:pointer;border:2px solid var(--linea);background:var(--panel)}
.btn.primario{background:var(--oro);color:#2A1D00;border-color:var(--oro);box-shadow:0 4px 18px rgba(253,181,43,.28)}
.btn.peligro{border-color:var(--error);color:var(--error)}
.btn.ancho{width:100%}
.btn:disabled{opacity:.6;cursor:wait}
.google{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;margin-top:8px;padding:12px 18px;border-radius:10px;border:0;background:#fff;color:#1F1F1F;font-weight:700;cursor:pointer}
.google svg{width:20px;height:20px}
:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
.msg{min-height:1.5em;margin:10px 0 0;color:var(--error)}
.msg.ok{color:var(--ok)}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:8px 0 12px;margin-bottom:8px;background:rgba(5,11,32,.85);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.topbar h1{flex:1;min-width:0;margin:0;font-size:1.5rem}
.icono{flex:none;width:44px;height:44px;display:grid;place-items:center;padding:0;border-radius:12px;background:var(--panel);border:2px solid var(--linea);cursor:pointer}
.icono svg{width:22px;height:22px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat,.panel{background:rgba(12,26,69,.8);border:2px solid var(--linea);border-radius:14px;box-shadow:0 8px 26px rgba(0,0,0,.35),inset 0 0 0 1px rgba(41,221,251,.07);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.stat{padding:12px 14px}
.stat small{display:block;color:var(--suave)}
.num-grande{font-size:1.7rem;line-height:1.1;color:var(--oro)}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;padding:10px;border-radius:10px;border:2px solid var(--linea);background:none;font-weight:700;cursor:pointer}
.tab.activa{background:var(--oro);color:#2A1D00;border-color:var(--oro)}
input,select,textarea{display:block;width:100%;padding:12px;border:2px solid var(--linea);border-radius:10px;background:var(--fondo);color:var(--texto);font:inherit}
input:focus,select:focus{border-color:var(--cian)}
.filtros{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{padding:7px 13px;border-radius:999px;border:2px solid var(--linea);background:none;font-weight:700;cursor:pointer}
.chip.activa{background:var(--oro);color:#2A1D00;border-color:var(--oro)}
.fila-orden{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 10px;color:var(--suave)}
.fila-orden select{width:auto;padding:8px 10px}
.lista{list-style:none;margin:0;padding:0;display:grid;gap:10px}
@media(min-width:700px){.lista{grid-template-columns:1fr 1fr}}
.cuenta{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border-radius:14px;border:2px solid var(--linea);background:rgba(12,26,69,.8);cursor:pointer}
.cuenta:hover{border-color:var(--cian)}
.avatar{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--linea);font-family:"Lilita One",system-ui,sans-serif;font-size:1.2rem}
.info{flex:1;min-width:0}
.info b,.info small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.info small{color:var(--suave)}
.der{flex:none;text-align:right}
.cred{display:block;color:var(--oro);font-weight:700}
.pill{display:inline-block;margin-top:2px;padding:1px 8px;border-radius:999px;font-size:.75rem;font-weight:700;border:1px solid var(--linea);color:var(--suave)}
.pill.mal{border-color:var(--error);color:var(--error)}
.pill.adm{border-color:var(--oro);color:var(--oro)}
.vacio{text-align:center;color:var(--suave);padding:28px 0}
.reg{list-style:none;margin:0;padding:0}
.reg li{padding:10px 0;border-bottom:1px solid var(--linea)}
.reg small{display:block;color:var(--suave)}
dialog{background:var(--panel);color:var(--texto);border:2px solid var(--linea);border-radius:14px;padding:18px;width:min(94vw,440px);max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.7)}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:12px 0}
dt{color:var(--suave)}
dd{margin:0;text-align:right;overflow-wrap:anywhere}
.bloque{border-top:1px solid var(--linea);margin-top:14px;padding-top:14px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
label{display:block;font-weight:700;font-size:.9rem}
label>*{margin-top:4px;font-weight:400}
.cabecera-dlg{display:flex;align-items:center;gap:12px}
.cabecera-dlg h2{margin:0;overflow-wrap:anywhere}
.acciones-c{display:flex;gap:8px;margin-top:8px}
.acciones-c .btn{flex:1;padding:10px}
</style>
</head>
<body>
<main>

  <section id="v-carga" class="centro">
    <div class="logo-hero" role="img" aria-label="Legion Clash"></div>
    <h1>Administración</h1>
    <p class="suave">Cargando…</p>
  </section>

  <section id="v-login" class="centro oculto">
    <div class="logo-hero" role="img" aria-label="Legion Clash"></div>
    <h1>Administración</h1>
    <p class="suave">Entra con la cuenta de Google de administrador.</p>
    <button type="button" class="google" id="btn-google">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      <span>Continuar con Google</span>
    </button>
    <p id="msg-login" class="msg" role="status"></p>
    <button type="button" class="btn oculto" id="btn-otra">Entrar con otra cuenta</button>
  </section>

  <section id="v-panel" class="oculto">
    <header class="topbar">
      <div class="logo-mini" role="img" aria-label="Legion Clash"></div>
      <h1>Administración</h1>
      <button type="button" class="icono" id="btn-refrescar" aria-label="Actualizar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
      </button>
      <button type="button" class="icono" id="btn-salir" aria-label="Cerrar sesión">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </header>

    <div class="stats">
      <div class="stat"><small>Cuentas</small><div class="num-grande" id="s-total">0</div></div>
      <div class="stat"><small>Con tag de Clash</small><div class="num-grande" id="s-tag">0</div></div>
      <div class="stat"><small>Suspendidas</small><div class="num-grande" id="s-susp">0</div></div>
      <div class="stat"><small>Créditos en juego</small><div class="num-grande" id="s-cred">0</div></div>
    </div>

    <div class="tabs" role="tablist">
      <button type="button" class="tab activa" data-tab="cuentas" role="tab">Cuentas</button>
      <button type="button" class="tab" data-tab="compras" role="tab">Compras<span id="n-compras"></span></button>
      <button type="button" class="tab" data-tab="registro" role="tab">Registro</button>
    </div>

    <section id="t-cuentas">
      <input id="buscar" type="search" placeholder="Buscar por nombre, correo, tag o teléfono" autocomplete="off">
      <div class="filtros" id="filtros">
        <button type="button" class="chip activa" data-f="todos">Todas</button>
        <button type="button" class="chip" data-f="tag">Con tag</button>
        <button type="button" class="chip" data-f="sintag">Sin tag</button>
        <button type="button" class="chip" data-f="sinreg">Sin registro</button>
        <button type="button" class="chip" data-f="susp">Suspendidas</button>
      </div>
      <div class="fila-orden">
        <span id="contador"></span>
        <select id="orden" aria-label="Ordenar por">
          <option value="reciente">Más recientes</option>
          <option value="ingreso">Último ingreso</option>
          <option value="creditos">Más créditos</option>
          <option value="victorias">Más victorias</option>
          <option value="nombre">Nombre (A-Z)</option>
        </select>
      </div>
      <ul class="lista" id="lista"></ul>
    </section>

    <section id="t-compras" class="oculto">
      <div class="panel" style="padding:16px">
        <h2>Solicitudes de créditos</h2>
        <ul class="reg" id="compras"></ul>
      </div>
    </section>

    <section id="t-registro" class="oculto">
      <div class="panel" style="padding:16px">
        <h2>Últimas acciones</h2>
        <ul class="reg" id="registro"></ul>
      </div>
    </section>
  </section>

  <dialog id="dlg">
    <div class="cabecera-dlg">
      <div class="avatar" id="d-avatar"></div>
      <h2 id="d-nombre"></h2>
    </div>
    <div id="d-pills"></div>
    <dl id="d-datos"></dl>

    <div class="bloque">
      <h2>Créditos</h2>
      <div class="dos">
        <label>Acción
          <select id="d-modo">
            <option value="sumar">Sumar</option>
            <option value="restar">Restar</option>
            <option value="fijar">Fijar saldo en</option>
          </select>
        </label>
        <label>Monto
          <input id="d-monto" type="number" inputmode="numeric" min="0" step="1" placeholder="0">
        </label>
      </div>
      <label>Motivo (opcional)
        <input id="d-motivo" maxlength="120" placeholder="Ej. premio del torneo">
      </label>
      <button type="button" class="btn primario ancho" id="d-aplicar" style="margin-top:10px">Aplicar</button>
    </div>

    <div class="bloque">
      <button type="button" class="btn ancho" id="d-estado"></button>
    </div>

    <p id="d-msg" class="msg" role="status"></p>
    <button type="button" class="btn ancho" id="d-cerrar">Cerrar</button>
  </dialog>

</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBOytBkkPwF5Rw_du0iOCIhnFtotOjUUuE",
  authDomain: "clash-royale-9e27b.firebaseapp.com",
  databaseURL: "https://clash-royale-9e27b-default-rtdb.firebaseio.com",
  projectId: "clash-royale-9e27b",
  appId: "1:792347939788:web:9b92040c8975f4bb098369"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const functions = firebase.functions();
const proveedor = new firebase.auth.GoogleAuthProvider();
proveedor.setCustomParameters({ prompt: "select_account" });

const $ = (id) => document.getElementById(id);
const llamar = (nombre, datos) => functions.httpsCallable(nombre)(datos || {}).then((r) => r.data);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (n) => Number(n || 0).toLocaleString("es-CO");
const fecha = (ms) => (ms ? new Date(ms).toLocaleString("es-CO", { dateStyle: "medium", timeStyle: "short" }) : "—");

let cuentas = [];
let filtro = "todos";
let orden = "reciente";
let busqueda = "";
let actual = null;      // cuenta abierta en el diálogo
let registroCargado = false;

function vista(id) {
  ["v-carga", "v-login", "v-panel"].forEach((v) => $(v).classList.toggle("oculto", v !== id));
}
function msgErr(e) {
  return (e && e.message) ? e.message.replace(/^.*?:\s*/, "") : "Algo salió mal. Intenta de nuevo.";
}

// ---------- Sesión ----------
$("btn-google").onclick = async () => {
  $("msg-login").textContent = "";
  try { await auth.signInWithPopup(proveedor); }
  catch (e) { if (e.code !== "auth/popup-closed-by-user") $("msg-login").textContent = "No se pudo iniciar sesión. Intenta de nuevo."; }
};
$("btn-otra").onclick = async () => { await auth.signOut(); };
$("btn-salir").onclick = async () => { await auth.signOut(); };

auth.onAuthStateChanged(async (u) => {
  $("btn-otra").classList.add("oculto");
  if (!u) { cuentas = []; registroCargado = false; vista("v-login"); return; }
  vista("v-carga");
  try {
    await cargar();
    vista("v-panel");
  } catch (e) {
    const denegado = e && e.code === "functions/permission-denied";
    $("msg-login").textContent = denegado ? "La cuenta " + u.email + " no es administradora." : msgErr(e);
    $("btn-otra").classList.remove("oculto");
    vista("v-login");
  }
});

// ---------- Datos ----------
async function cargar() {
  const r = await llamar("adminListar");
  cuentas = r.cuentas || [];
  pintarStats();
  pintarLista();
  if (registroCargado) cargarRegistro();
  cargarCompras();
}
$("btn-refrescar").onclick = async () => {
  const b = $("btn-refrescar"); b.disabled = true;
  try { await cargar(); } catch (e) { alert(msgErr(e)); }
  b.disabled = false;
};

function pintarStats() {
  $("s-total").textContent = num(cuentas.length);
  $("s-tag").textContent = num(cuentas.filter((c) => c.tag).length);
  $("s-susp").textContent = num(cuentas.filter((c) => c.suspendido).length);
  $("s-cred").textContent = num(cuentas.reduce((t, c) => t + (c.creditos || 0), 0));
}

// ---------- Lista ----------
const FILTROS = {
  todos: () => true,
  tag: (c) => !!c.tag,
  sintag: (c) => c.registrado && !c.tag,
  sinreg: (c) => !c.registrado,
  susp: (c) => c.suspendido,
};
const ORDENES = {
  reciente: (a, b) => (b.creadoEn || 0) - (a.creadoEn || 0),
  ingreso: (a, b) => (b.ultimoIngreso || 0) - (a.ultimoIngreso || 0),
  creditos: (a, b) => (b.creditos || 0) - (a.creditos || 0),
  victorias: (a, b) => (b.victorias || 0) - (a.victorias || 0),
  nombre: (a, b) => (a.nombre || a.correo).localeCompare(b.nombre || b.correo, "es"),
};

function pintarLista() {
  const q = busqueda.trim().toLowerCase();
  const filas = cuentas
    .filter(FILTROS[filtro])
    .filter((c) => !q || [c.nombre, c.correo, c.tag, c.telefono, c.uid].some((x) => String(x || "").toLowerCase().includes(q)))
    .sort(ORDENES[orden]);
  $("contador").textContent = filas.length + (filas.length === 1 ? " cuenta" : " cuentas");
  $("lista").innerHTML = filas.length ? filas.map((c) => {
    const nombre = c.nombre || c.correo || "Sin nombre";
    const pills = (c.esAdmin ? '<span class="pill adm">Admin</span> ' : "") +
      (c.suspendido ? '<span class="pill mal">Suspendida</span>' : "") +
      (!c.registrado ? '<span class="pill">Sin registro</span>' : "");
    return '<li><button type="button" class="cuenta" data-uid="' + esc(c.uid) + '">' +
      '<span class="avatar">' + esc(nombre.trim().charAt(0).toUpperCase()) + '</span>' +
      '<span class="info"><b>' + esc(nombre) + '</b><small>' + esc(c.correo) + '</small><small>' + esc(c.tag || "Sin tag") + ' · ' + num(c.victorias) + ' victorias</small></span>' +
      '<span class="der"><span class="cred">' + num(c.creditos) + '</span>' + pills + '</span>' +
      '</button></li>';
  }).join("") : '<li class="vacio">No hay cuentas con ese filtro.</li>';
}

$("buscar").addEventListener("input", (e) => { busqueda = e.target.value; pintarLista(); });
$("orden").addEventListener("change", (e) => { orden = e.target.value; pintarLista(); });
$("filtros").addEventListener("click", (e) => {
  const b = e.target.closest(".chip"); if (!b) return;
  filtro = b.dataset.f;
  document.querySelectorAll("#filtros .chip").forEach((x) => x.classList.toggle("activa", x === b));
  pintarLista();
});
$("lista").addEventListener("click", (e) => {
  const b = e.target.closest(".cuenta"); if (!b) return;
  abrir(cuentas.find((c) => c.uid === b.dataset.uid));
});

// ---------- Pestañas y registro ----------
document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("activa", x === t));
  $("t-cuentas").classList.toggle("oculto", t.dataset.tab !== "cuentas");
  $("t-compras").classList.toggle("oculto", t.dataset.tab !== "compras");
  $("t-registro").classList.toggle("oculto", t.dataset.tab !== "registro");
  if (t.dataset.tab === "compras") cargarCompras();
  if (t.dataset.tab === "registro") cargarRegistro();
}));

function textoAccion(r) {
  switch (r.accion) {
    case "sumar": return "Sumó " + num(r.monto) + " créditos (" + num(r.antes) + " → " + num(r.despues) + ")";
    case "restar": return "Restó " + num(r.monto) + " créditos (" + num(r.antes) + " → " + num(r.despues) + ")";
    case "fijar": return "Fijó el saldo en " + num(r.monto) + " (antes " + num(r.antes) + ")";
    case "suspender": return "Suspendió la cuenta";
    case "reactivar": return "Reactivó la cuenta";
    case "compra": return "Aprobó una compra de " + num(r.monto) + " créditos";
    case "compra-rechazada": return "Rechazó una compra de " + num(r.monto) + " créditos";
    default: return r.accion || "";
  }
}
// ---------- Compras de créditos ----------
let comprasAdmin = [];
const ESTADO_C = { pendiente: "Pendiente", procesando: "Acreditando…", aprobada: "Aprobada", rechazada: "Rechazada" };
async function cargarCompras() {
  const ul = $("compras");
  try {
    const r = await llamar("adminCompras");
    comprasAdmin = r.compras || [];
    const pend = comprasAdmin.filter((c) => c.estado === "pendiente").length;
    $("n-compras").textContent = pend ? " (" + pend + ")" : "";
    ul.innerHTML = comprasAdmin.length ? comprasAdmin.map((c) =>
      "<li><b>" + esc(c.nombre || c.correo || c.uid) + "</b> — " + num(c.creditos) + " créditos · " + esc(c.pesos != null ? "$" + num(c.pesos) + " COP" : "$" + c.usd + " USD") +
      "<small>" + esc(c.correo) + (c.tag ? " · " + esc(c.tag) : "") + " · " + esc(fecha(c.fecha)) + "</small>" +
      '<span class="pill' + (c.estado === "rechazada" ? " mal" : c.estado === "pendiente" ? " adm" : "") + '">' + esc(ESTADO_C[c.estado] || c.estado) + "</span>" +
      (c.estado === "pendiente"
        ? '<div class="acciones-c"><button type="button" class="btn primario" data-resolver="' + esc(c.id) + '" data-aprobar="1">Aprobar y acreditar</button>' +
          '<button type="button" class="btn peligro" data-resolver="' + esc(c.id) + '">Rechazar</button></div>'
        : "") +
      "</li>").join("") : '<li class="vacio">Todavía no hay solicitudes de compra.</li>';
  } catch (e) { ul.innerHTML = '<li class="vacio">' + esc(msgErr(e)) + "</li>"; }
}
$("compras").addEventListener("click", async (ev) => {
  const b = ev.target.closest("[data-resolver]");
  if (!b) return;
  const c = comprasAdmin.find((x) => x.id === b.dataset.resolver);
  if (!c) return;
  const aprobar = !!b.dataset.aprobar;
  const quien = c.nombre || c.correo;
  if (!confirm(aprobar ? "¿Ya recibiste el pago de " + (c.pesos != null ? "$" + num(c.pesos) + " COP" : "$" + c.usd + " USD") + " de " + quien + "?\nSe le acreditarán " + c.creditos + " créditos." : "¿Rechazar la solicitud de " + quien + "?")) return;
  b.disabled = true;
  try { await llamar("adminResolverCompra", { id: c.id, aprobar }); await cargar(); }
  catch (e) { alert(msgErr(e)); b.disabled = false; }
});

async function cargarRegistro() {
  registroCargado = true;
  const ul = $("registro");
  ul.innerHTML = '<li class="vacio">Cargando…</li>';
  try {
    const r = await llamar("adminRegistro");
    const lista = r.registros || [];
    ul.innerHTML = lista.length ? lista.map((x) => {
      const c = cuentas.find((y) => y.uid === x.uid);
      return "<li><b>" + esc(c ? (c.nombre || c.correo) : x.uid) + "</b> — " + esc(textoAccion(x)) +
        "<small>" + esc(fecha(x.fecha)) + " · " + esc(x.admin) + (x.motivo ? " · " + esc(x.motivo) : "") + "</small></li>";
    }).join("") : '<li class="vacio">Todavía no hay acciones.</li>';
  } catch (e) { ul.innerHTML = '<li class="vacio">' + esc(msgErr(e)) + "</li>"; }
}

// ---------- Detalle de cuenta ----------
function abrir(c) {
  if (!c) return;
  actual = c;
  $("d-msg").textContent = ""; $("d-msg").className = "msg";
  $("d-monto").value = ""; $("d-motivo").value = ""; $("d-modo").value = "sumar";
  pintarDetalle();
  $("dlg").showModal();
}
function pintarDetalle() {
  const c = actual;
  const nombre = c.nombre || c.correo || "Sin nombre";
  $("d-avatar").textContent = nombre.trim().charAt(0).toUpperCase();
  $("d-nombre").textContent = nombre;
  $("d-pills").innerHTML = (c.esAdmin ? '<span class="pill adm">Admin</span> ' : "") +
    (c.suspendido ? '<span class="pill mal">Suspendida</span> ' : "") + (!c.registrado ? '<span class="pill">Sin registro</span>' : "");
  const fila = (k, v) => "<dt>" + k + "</dt><dd>" + esc(v || "—") + "</dd>";
  $("d-datos").innerHTML = fila("Correo", c.correo) + fila("Teléfono", c.telefono) + fila("Tag", c.tag) +
    "<dt>Enlace de amigo</dt><dd>" + (c.enlace ? '<a style="color:var(--cian)" href="' + esc(c.enlace) + '" target="_blank" rel="noopener noreferrer">Abrir</a>' : "—") + "</dd>" +
    fila("Créditos", num(c.creditos)) + fila("Victorias", num(c.victorias)) +
    fila("Creada", fecha(c.creadoEn)) + fila("Último ingreso", fecha(c.ultimoIngreso)) + fila("UID", c.uid);
  const b = $("d-estado");
  b.textContent = c.suspendido ? "Reactivar cuenta" : "Suspender cuenta";
  b.className = "btn ancho" + (c.suspendido ? "" : " peligro");
  b.disabled = !!c.esAdmin;
}
function dlgMsg(t, ok) { $("d-msg").textContent = t; $("d-msg").className = "msg" + (ok ? " ok" : ""); }
$("d-cerrar").onclick = () => $("dlg").close();

$("d-aplicar").onclick = async () => {
  const modo = $("d-modo").value;
  const monto = Number($("d-monto").value);
  if (!Number.isInteger(monto) || monto < (modo === "fijar" ? 0 : 1)) { dlgMsg("Escribe un monto entero válido."); return; }
  const verbo = { sumar: "sumar", restar: "restar", fijar: "fijar el saldo en" }[modo];
  if (!confirm("¿Seguro que quieres " + verbo + " " + num(monto) + " créditos a " + (actual.nombre || actual.correo) + "?")) return;
  const b = $("d-aplicar"); b.disabled = true; dlgMsg("");
  try {
    const r = await llamar("adminCreditos", { uid: actual.uid, modo, monto, motivo: $("d-motivo").value.trim() });
    actual.creditos = r.creditos;
    $("d-monto").value = ""; $("d-motivo").value = "";
    pintarDetalle(); pintarStats(); pintarLista();
    dlgMsg("Listo. Saldo: " + num(r.creditos), true);
    registroCargado = false;
  } catch (e) { dlgMsg(msgErr(e)); }
  b.disabled = false;
};

$("d-estado").onclick = async () => {
  const suspender = !actual.suspendido;
  if (!confirm((suspender ? "¿Suspender" : "¿Reactivar") + " la cuenta de " + (actual.nombre || actual.correo) + "?")) return;
  const b = $("d-estado"); b.disabled = true; dlgMsg("");
  try {
    const r = await llamar("adminEstado", { uid: actual.uid, suspender });
    actual.suspendido = r.suspendido;
    pintarDetalle(); pintarStats(); pintarLista();
    dlgMsg(r.suspendido ? "Cuenta suspendida. Se corta el acceso cuando expire su sesión actual (hasta 1 hora)." : "Cuenta reactivada.", true);
    registroCargado = false;
  } catch (e) { dlgMsg(msgErr(e)); pintarDetalle(); }
};
</script>
</body>
</html>
